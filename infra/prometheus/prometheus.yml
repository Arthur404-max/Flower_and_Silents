global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: cvetotishina-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: api
          scrape: primary
      - targets: ["api:3000"]
        labels:
          service: api
          scrape: secondary
  - job_name: cvetotishina-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3001"]
        labels:
          service: worker
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
